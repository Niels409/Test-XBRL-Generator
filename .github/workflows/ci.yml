name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: pip install --quiet openpyxl
      - name: Build template, scenario sets, app and Azure package
        run: ./build.sh
      - name: Official SBR Nexus examples against the built-in check
        run: |
          node test/base_check.js
          node test/base_check.js data/appdata-vt15.json
      - name: Scenario tests (700+)
        run: node test/deep.js
      - name: Review tests
        run: node test/review.js
      - name: Azure Function (local run)
        run: cd azure && node test-local.js template.xlsx ../test/out/azure
      - name: Browser test (headless Chromium)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          # Playwright's own Chromium when the runner OS supports it, otherwise the Google Chrome that ships with the runner image
          if npx playwright install --with-deps chromium; then node test/ui.js
          else CHROMIUM_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)" node test/ui.js; fi
      - name: Rebuild package up to date and passing its acceptance test
        run: |
          node tools/export_rebuild.js --files out/acceptance
          git diff --exit-code -- rebuild/ || { echo "rebuild/ is not up to date: run node tools/export_rebuild.js and commit"; exit 1; }
          python3 tools/check_acceptance.py out/acceptance
      - name: Upload the built app
        uses: actions/upload-artifact@v4
        with:
          name: test-xbrl-generator-${{ github.sha }}
          path: dist/
          retention-days: 30
