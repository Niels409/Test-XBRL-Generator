name: probe
on:
  push:
    branches: [ci-probe]
permissions:
  contents: read
jobs:
  arelle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VT17_PACKAGE_URL: https://pub-5ff4320167a14f958d5d55262805643c.r2.dev/media/VT17_FRC_20240131_Package_update_20260804.zip
      VT15_PACKAGE_URL: https://pub-5ff4320167a14f958d5d55262805643c.r2.dev/media/VT15_FRC_20210421_Package.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install --quiet arelle-release openpyxl
      - name: Download taxonomy packages
        run: |
          mkdir -p pkg
          curl -sSfL "$VT17_PACKAGE_URL" -o pkg/vt17.zip
          curl -sSfL "$VT15_PACKAGE_URL" -o pkg/vt15.zip
          sha256sum pkg/*.zip
          for z in pkg/*.zip; do unzip -l "$z" | head -8; unzip -l "$z" | tail -1; done
          unzip -p pkg/vt17.zip '*/META-INF/taxonomyPackage.xml' | head -40
      - name: Generate the scenario sets
        run: |
          python3 build/scenario_sets.py data/appdata-vt17.json sets
          node tools/generate_from_sets.js sets gen
      - name: Validate with Arelle
        run: |
          python3 tools/arelle_validate.py --packages pkg/vt17.zip pkg/vt15.zip --out arelle --expected gen/expected.json --jobs 4 gen || true
          cat arelle/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arelle-results
          path: arelle
          retention-days: 7
